<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#05080d">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/static/icon.svg">
<title>Jarvis</title>
<style>
  :root {
    --bg: #05080d; --panel: #0c131c; --text: #d8e6f3; --muted: #6f8399;
    --accent: #38c6ff; --accent-2: #8be9ff; --you: #16324a; --warn: #ff7a59;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: radial-gradient(ellipse at 50% 85%, #0b2233 0%, var(--bg) 60%);
    color: var(--text); font: 16px/1.45 -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column; overflow: hidden;
  }
  header { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px 6px; }
  header h1 { font-size: 15px; letter-spacing: .35em; font-weight: 600; margin: 0; color: var(--accent-2); }
  header .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); display: inline-block; margin-right: 8px; }
  header .dot.on { background: #3ddc84; box-shadow: 0 0 8px #3ddc84; }
  header button { background: none; border: 1px solid #1d2b3a; color: var(--muted); border-radius: 8px; padding: 6px 10px; font-size: 13px; }
  #log { flex: 1; overflow-y: auto; padding: 8px 16px 16px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 85%; padding: 10px 14px; border-radius: 16px; white-space: pre-wrap; word-wrap: break-word; }
  .you { align-self: flex-end; background: var(--you); border-bottom-right-radius: 4px; }
  .jarvis { align-self: flex-start; background: var(--panel); border: 1px solid #14212e; border-bottom-left-radius: 4px; }
  .announce { border-color: var(--accent); }
  .sys { align-self: center; color: var(--muted); font-size: 13px; }
  #status { text-align: center; color: var(--muted); font-size: 13px; min-height: 20px; }
  #controls { padding: 8px 16px calc(16px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; align-items: center; gap: 12px; }
  #mic {
    width: 112px; height: 112px; border-radius: 50%; border: none; cursor: pointer; position: relative;
    background: radial-gradient(circle, #e9fbff 0%, #8be9ff 18%, #1aa3d9 42%, #0b3b55 70%, #061520 100%);
    box-shadow: 0 0 24px rgba(56,198,255,.45), inset 0 0 18px rgba(255,255,255,.25);
    transition: transform .15s; -webkit-tap-highlight-color: transparent; touch-action: none;
  }
  #mic::after { content: ""; position: absolute; inset: -10px; border-radius: 50%; border: 2px solid rgba(56,198,255,.35); }
  #mic.rec { transform: scale(1.08); box-shadow: 0 0 46px rgba(56,198,255,.9), inset 0 0 22px rgba(255,255,255,.4); }
  #mic.rec::after { animation: pulse 1.1s infinite; }
  #mic.busy::after { border-top-color: var(--accent-2); animation: spin 1s linear infinite; }
  @keyframes pulse { from { transform: scale(1); opacity: 1 } to { transform: scale(1.35); opacity: 0 } }
  @keyframes spin { to { transform: rotate(360deg) } }
  form { display: flex; gap: 8px; width: 100%; max-width: 640px; }
  input[type=text] { flex: 1; background: var(--panel); border: 1px solid #1d2b3a; color: var(--text); border-radius: 12px; padding: 12px 14px; font-size: 16px; min-width: 0; }
  form button { background: var(--accent); color: #022; border: none; border-radius: 12px; padding: 0 16px; font-weight: 600; }
  #setup { position: fixed; inset: 0; background: var(--bg); display: none; align-items: center; justify-content: center; padding: 24px; }
  #setup div { max-width: 420px; width: 100%; }
  label.tog { color: var(--muted); font-size: 13px; display: flex; gap: 6px; align-items: center; }
</style>
</head>
<body>
<header>
  <div><span class="dot" id="dot"></span><h1 style="display:inline">J.A.R.V.I.S.</h1></div>
  <div style="display:flex;gap:8px;align-items:center">
    <label class="tog"><input type="checkbox" id="speak" checked> voice</label>
    <button id="reset" title="New conversation">New</button>
  </div>
</header>
<div id="log"></div>
<div id="status"></div>
<div id="controls">
  <button id="mic" aria-label="Hold to talk"></button>
  <form id="form"><input type="text" id="text" placeholder="Type to Jarvis…" autocomplete="off"><button>Send</button></form>
</div>
<div id="setup"><div>
  <h2>Connect to Jarvis</h2>
  <p style="color:var(--muted)">Paste the access token shown by <code>jarvis setup</code> on your Mac (or open the link it prints).</p>
  <form id="tokform"><input type="text" id="tok" placeholder="token"><button>Save</button></form>
</div></div>
<script>
const $ = (id) => document.getElementById(id);
const params = new URLSearchParams(location.search);
if (params.get("token")) { localStorage.setItem("jarvis_token", params.get("token")); history.replaceState(null, "", "/"); }
let TOKEN = localStorage.getItem("jarvis_token") || "";
const SESSION = "web";
let ws, audioCtx, playQ = Promise.resolve(), currentJarvisEl = null, speakOn = localStorage.getItem("jarvis_speak") !== "0";
$("speak").checked = speakOn;
$("speak").onchange = (e) => { speakOn = e.target.checked; localStorage.setItem("jarvis_speak", speakOn ? "1" : "0"); };

function add(cls, text) {
  const el = document.createElement("div"); el.className = "msg " + cls; el.textContent = text;
  $("log").appendChild(el); $("log").scrollTop = $("log").scrollHeight; return el;
}
function status(t) { $("status").textContent = t || ""; }

function connect() {
  if (!TOKEN) { $("setup").style.display = "flex"; return; }
  const proto = location.protocol === "https:" ? "wss" : "ws";
  ws = new WebSocket(`${proto}://${location.host}/ws?token=${encodeURIComponent(TOKEN)}`);
  ws.onopen = () => { $("dot").classList.add("on"); status(""); };
  ws.onclose = (e) => {
    $("dot").classList.remove("on");
    if (e.code === 4401) { localStorage.removeItem("jarvis_token"); TOKEN = ""; $("setup").style.display = "flex"; return; }
    status("Reconnecting…"); setTimeout(connect, 2000);
  };
  ws.onmessage = (ev) => {
    const m = JSON.parse(ev.data);
    if (m.type === "delta") { if (!currentJarvisEl) currentJarvisEl = add("jarvis", ""); currentJarvisEl.textContent += m.text; $("log").scrollTop = $("log").scrollHeight; }
    else if (m.type === "sentence") { speak(m.text); }
    else if (m.type === "status") { status("Working: " + m.text.replaceAll("_", " ") + "…"); }
    else if (m.type === "done") { if (!currentJarvisEl && m.text) add("jarvis", m.text); currentJarvisEl = null; status(""); $("mic").classList.remove("busy"); }
    else if (m.type === "announce") { add("jarvis announce", m.text); speak(m.text); }
    else if (m.type === "info") { add("sys", m.text); }
  };
}

function send(text) {
  text = text.trim(); if (!text) return;
  if (!ws || ws.readyState !== 1) { status("Not connected"); return; }
  add("you", text); currentJarvisEl = null; status("Thinking…"); $("mic").classList.add("busy");
  ws.send(JSON.stringify({ type: "chat", text, session: SESSION }));
}

function unlockAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === "suspended") audioCtx.resume();
}
function speak(text) {
  if (!speakOn || !text || !audioCtx) return;  // audio unlocks on first tap
  const fetched = fetch(`/api/tts?text=${encodeURIComponent(text)}`, { headers: { Authorization: "Bearer " + TOKEN } })
    .then((r) => r.arrayBuffer()).then((b) => audioCtx.decodeAudioData(b)).catch(() => null);
  playQ = playQ.then(() => fetched).then((buf) => new Promise((res) => {
    if (!buf) return res();
    const src = audioCtx.createBufferSource(); src.buffer = buf; src.connect(audioCtx.destination);
    src.onended = res; src.start(); currentSources.add(src); src.addEventListener("ended", () => currentSources.delete(src));
  }));
}
const currentSources = new Set();
function stopSpeaking() { currentSources.forEach((s) => { try { s.stop(); } catch (e) {} }); currentSources.clear(); playQ = Promise.resolve(); }

// --- hold-to-talk (tap also toggles) -------------------------------------
let rec, chunks = [], recording = false, pressT = 0;
async function startRec() {
  unlockAudio(); stopSpeaking();
  if (!navigator.mediaDevices?.getUserMedia) { status("Mic needs HTTPS — see README (Tailscale or self-signed cert)"); return; }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true } });
    rec = new MediaRecorder(stream); chunks = [];
    rec.ondataavailable = (e) => e.data.size && chunks.push(e.data);
    rec.onstop = async () => {
      stream.getTracks().forEach((t) => t.stop());
      const blob = new Blob(chunks, { type: rec.mimeType || "audio/webm" });
      if (blob.size < 2000) { status(""); return; }
      status("Transcribing…");
      const fd = new FormData(); fd.append("audio", blob, "speech.webm");
      try {
        const r = await fetch("/api/transcribe", { method: "POST", body: fd, headers: { Authorization: "Bearer " + TOKEN } });
        const j = await r.json();
        if (j.text) send(j.text); else status("Didn't catch that.");
      } catch (e) { status("Upload failed"); }
    };
    rec.start(); recording = true; $("mic").classList.add("rec"); status("Listening… release to send");
    if (navigator.vibrate) navigator.vibrate(20);
  } catch (e) { status("Mic blocked: " + e.message); }
}
function stopRec() { if (recording && rec) { rec.stop(); recording = false; $("mic").classList.remove("rec"); } }
$("mic").addEventListener("pointerdown", (e) => { e.preventDefault(); pressT = Date.now(); if (recording) stopRec(); else startRec(); });
$("mic").addEventListener("pointerup", () => { if (Date.now() - pressT > 400) stopRec(); /* short tap = toggle mode */ });
$("mic").addEventListener("contextmenu", (e) => e.preventDefault());

$("form").onsubmit = (e) => { e.preventDefault(); unlockAudio(); send($("text").value); $("text").value = ""; };
$("reset").onclick = () => { ws && ws.readyState === 1 && ws.send(JSON.stringify({ type: "reset", session: SESSION })); $("log").innerHTML = ""; };
$("tokform").onsubmit = (e) => { e.preventDefault(); TOKEN = $("tok").value.trim(); localStorage.setItem("jarvis_token", TOKEN); $("setup").style.display = "none"; connect(); };

if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js").catch(() => {});
connect();
add("sys", "Hold the circle to talk, or tap once to start and again to stop.");
</script>
</body>
</html>
