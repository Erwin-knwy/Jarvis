[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis"
version = "0.1.0"
description = "Personal voice assistant for macOS + Android, powered by Claude"
requires-python = ">=3.11"
dependencies = [
  "anthropic>=2.5",
  "python-dotenv",
  "pyyaml",
  "rich",
  "httpx",
  "numpy",
  "scipy",
  "sounddevice",
  "openwakeword==0.6.0",
  "onnxruntime==1.19.2",   # last release with Intel-Mac wheels
  "faster-whisper>=1.2",
  "av",
  "piper-tts>=1.8",
  "fastapi",
  "uvicorn[standard]",
  "python-multipart",
  "python-telegram-bot>=22",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
jarvis = "jarvis.__main__:main"

[tool.setuptools.packages.find]
include = ["jarvis*"]

[tool.setuptools.package-data]
"jarvis.server" = ["static/*"]
