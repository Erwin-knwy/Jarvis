# Jarvis configuration. Secrets live in .env (API key, tokens, ntfy topic).
user_name: "sir"            # how Jarvis addresses you
city: ""                    # default city for weather, e.g. "Tehran"
timezone: ""                # blank = system timezone

brain:
  backend: auto             # auto | claude_code (your Claude subscription, no key) | api (ANTHROPIC_API_KEY)
  claude_code_model: sonnet # model Claude Code uses: haiku (fastest) | sonnet | opus
  instant_commands: true    # handle simple commands (wifi off, volume 30, timers…) instantly without AI
  model: claude-opus-5-5    # alternatives: claude-sonnet-5-5, claude-haiku-5-5 (cheaper/faster)
  effort: low               # low | medium | high — low keeps voice replies fast
  max_tokens: 16000
  session_idle_minutes: 15  # start a fresh conversation after this much silence
  web_search: true

voice:
  wake_word: hey_jarvis
  wake_threshold: 0.5       # lower = more sensitive (0.3–0.7)
  tts_engine: piper         # piper | say
  piper_voice: en_GB-alan-medium
  piper_speaker: null       # for multi-speaker voices (semaine: 1=spike, 2=obadiah)
  speed: 1.0                # length scale: <1 faster, >1 slower
  say_voice: Daniel         # macOS fallback voice
  whisper_model: base.en    # base.en (fast) | small.en (more accurate, ~3x slower)
  silence_ms: 800           # end-of-speech silence
  max_listen_s: 15
  follow_up_s: 5            # listen this long after answering without needing the wake word

server:
  host: 0.0.0.0
  port: 8765

notifications:
  ntfy_server: https://ntfy.sh   # topic is JARVIS_NTFY_TOPIC in .env

briefing:
  enabled: true
  time: "08:00"

telegram:
  announce_incoming: true   # read out new private Telegram messages (needs `jarvis telegram-login`)

phone:
  announce_on_mac: true     # also announce phone calls/SMS on the Mac when Jarvis Phone is linked
